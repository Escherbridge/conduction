<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Detail - Conduction</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.0-beta.1/bundles/datastar.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="app-root">
        <header>
            <h1>Conduction</h1>
            <p>Mission Run Detail</p>
            <nav>
                <a href="/runs">← Back to Runs</a>
            </nav>
        </header>
        <main id="main-content">
            <div class="run-detail">
                <h2 id="run-title">Loading...</h2>
                <div class="run-info" id="run-info">
                    <div class="run-info-item">
                        <span class="run-info-label">Status</span>
                        <span class="run-info-value run-status" id="run-status">-</span>
                    </div>
                    <div class="run-info-item">
                        <span class="run-info-label">Started</span>
                        <span class="run-info-value" id="run-started">-</span>
                    </div>
                    <div class="run-info-item">
                        <span class="run-info-label">Repo</span>
                        <span class="run-info-value" id="run-repo">-</span>
                    </div>
                    <div class="run-info-item" id="connection-badge-item" style="display: none;">
                        <span class="run-info-label">Connection</span>
                        <span class="run-info-value connection-badge" id="connection-badge">Disconnected — retrying</span>
                    </div>
                </div>
                <div class="mission-completion-pill" id="mission-completion-pill" style="display: none;"></div>

                <!-- Mission Steering Controls -->
                <div class="mission-controls" style="margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9;">
                    <h3 style="margin-top: 0;">Mission Controls</h3>

                    <!-- Interrupt Button (shown only when running) -->
                    <div id="interrupt-control" style="display: none; margin-bottom: 1rem;">
                        <button id="interrupt-btn" style="padding: 0.5rem 1rem; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">
                            Interrupt Mission
                        </button>
                        <span id="interrupt-status" style="margin-left: 1rem; color: #666;"></span>
                    </div>

                    <!-- Resume Form -->
                    <div id="resume-control">
                        <h4 style="margin-top: 0;">Resume with Edits</h4>
                        <div id="agent-brief-editors"></div>
                        <button id="resume-btn" style="padding: 0.5rem 1rem; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 1rem;">
                            Resume Mission
                        </button>
                        <span id="resume-status" style="margin-left: 1rem; color: #666;"></span>
                    </div>
                </div>

                <div class="swimlanes-container">
                    <div class="swimlanes-header">
                        <h3>Agent Swim Lanes</h3>
                        <div style="font-size: 0.85rem; color: #666;">
                            <span style="display: inline-block; margin-right: 1rem;">
                                <span style="display: inline-block; width: 12px; height: 12px; background: #4a90e2; border-radius: 50%; margin-right: 4px;"></span>
                                Request
                            </span>
                            <span style="display: inline-block; margin-right: 1rem;">
                                <span style="display: inline-block; width: 12px; height: 12px; background: #50c878; border-radius: 50%; margin-right: 4px;"></span>
                                Response
                            </span>
                            <span style="display: inline-block; margin-right: 1rem;">
                                <span style="display: inline-block; width: 12px; height: 12px; background: #9b59b6; border-radius: 50%; margin-right: 4px;"></span>
                                Claim OK
                            </span>
                            <span style="display: inline-block; margin-right: 1rem;">
                                <span style="display: inline-block; width: 12px; height: 12px; background: #e74c3c; border-radius: 50%; margin-right: 4px;"></span>
                                Claim Rejected
                            </span>
                            <span style="display: inline-block; margin-right: 1rem;">
                                <span style="display: inline-block; width: 12px; height: 12px; background: #f39c12; border-radius: 50%; margin-right: 4px;"></span>
                                Finding
                            </span>
                            <span style="display: inline-block;">
                                <span style="display: inline-block; width: 10px; height: 10px; background: #d35400; margin-right: 4px; transform: rotate(45deg);"></span>
                                Blocked Command
                            </span>
                        </div>
                    </div>
                    <div id="swimlanes"></div>
                </div>

                <div class="findings-section">
                    <h3>Findings</h3>
                    <div id="findings"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const RUN_ID = decodeURIComponent(window.location.pathname.split('/').pop());
        const agentEvents = {}; // Store events by agent name
        const agentData = {}; // Store agent metadata
        let eventTimeRange = { min: Infinity, max: -Infinity };
        let findings = [];
        let targetRepo = null;
        let runStatus = null;
        let missionEventSource = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[character]));
        }

        function repoBasename(fullPath) {
            if (!fullPath) {
                return null;
            }
            const normalized = fullPath.replace(/\\/g, '/');
            const segments = normalized.split('/').filter(Boolean);
            return segments.length ? segments[segments.length - 1] : fullPath;
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('run-title').textContent = RUN_ID;

            // Fetch run status/started_at from the runs list (stable endpoint)
            await fetchRunMeta();

            // Fetch agents
            await fetchAgents();

            // Fetch findings
            await fetchFindings();

            // Set up SSE for live events (single data path, no polling fallback)
            setupEventStream();

            // Set up mission controls
            setupMissionControls();
        });

        async function fetchRunMeta() {
            try {
                const response = await fetch('/api/runs');
                const runs = await response.json();
                const currentRun = Array.isArray(runs) ? runs.find(run => run.run_id === RUN_ID) : null;

                if (currentRun) {
                    runStatus = currentRun.status || 'running';
                    document.getElementById('run-started').textContent = currentRun.started_at
                        ? new Date(currentRun.started_at).toLocaleString()
                        : '-';
                    renderStatusPill(runStatus);
                }

                checkRunStatus();
            } catch (error) {
                console.error('Error fetching run metadata:', error);
            }
        }

        async function fetchAgents() {
            try {
                const response = await fetch(`/api/runs/${encodeURIComponent(RUN_ID)}/agents`);
                const { agents, target_repo: fetchedTargetRepo } = await response.json();

                targetRepo = fetchedTargetRepo || null;
                renderTargetRepo();

                (agents || []).forEach(agent => {
                    agentData[agent.name] = agent;
                    agentEvents[agent.name] = [];
                });

                renderSwimLanes();
            } catch (error) {
                console.error('Error fetching agents:', error);
            }
        }

        function renderTargetRepo() {
            const repoSpan = document.getElementById('run-repo');
            const basename = repoBasename(targetRepo);

            if (basename) {
                repoSpan.textContent = basename;
                repoSpan.title = targetRepo;
            } else {
                repoSpan.textContent = '-';
                repoSpan.removeAttribute('title');
            }
        }

        async function fetchFindings() {
            try {
                const response = await fetch(`/api/runs/${encodeURIComponent(RUN_ID)}/findings`);
                findings = await response.json();
                renderFindings();
            } catch (error) {
                console.error('Error fetching findings:', error);
            }
        }

        function setupEventStream() {
            missionEventSource = new EventSource(`/api/runs/${encodeURIComponent(RUN_ID)}/events`);

            missionEventSource.addEventListener('run-event', handleRunEvent);
            missionEventSource.addEventListener('run-complete', handleRunComplete);

            missionEventSource.onopen = () => {
                hideConnectionBadge();
            };

            // EventSource retries automatically; only surface status, no manual retry loop
            missionEventSource.onerror = () => {
                showConnectionBadge();
            };
        }

        function showConnectionBadge() {
            document.getElementById('connection-badge-item').style.display = 'flex';
        }

        function hideConnectionBadge() {
            document.getElementById('connection-badge-item').style.display = 'none';
        }

        function handleRunEvent(e) {
            const ev = JSON.parse(e.data);

            // mission.completed is run-scoped, not agent-scoped: show the
            // completion pill only, do not create a swim lane for it.
            if (ev.type === 'mission.completed') {
                renderMissionCompletionPill(ev.payload || {});
                return;
            }

            const actor = ev.actor || 'unknown';

            if (!agentEvents[actor]) {
                agentEvents[actor] = [];
            }
            if (!agentData[actor]) {
                agentData[actor] = { name: actor, status: 'unknown', turns: 0, cost_usd: 0 };
            }

            const alreadySeen = agentEvents[actor].some(existingEvent => existingEvent.seq === ev.seq);
            if (alreadySeen) {
                return;
            }

            agentEvents[actor].push(ev);
            applyAgentEventToAgentData(ev);

            const eventTime = Date.parse(ev.ts);
            const resolvedTime = Number.isNaN(eventTime) ? Date.now() : eventTime;
            eventTimeRange.min = Math.min(eventTimeRange.min, resolvedTime);
            eventTimeRange.max = Math.max(eventTimeRange.max, resolvedTime);

            if (ev.type === 'finding.recorded') {
                recordFindingFromEvent(ev);
            }

            renderSwimLanes();
        }

        function applyAgentEventToAgentData(ev) {
            const actor = ev.actor;
            const payload = ev.payload || {};

            if (!actor || !agentData[actor]) {
                return;
            }

            if (ev.type === 'agent.requested') {
                agentData[actor].status = 'requested';
                const identity = payload.identity || {};
                if (identity.model) {
                    agentData[actor].model = identity.model;
                }
            } else if (ev.type === 'agent.responded') {
                agentData[actor].status = payload.error ? 'error' : 'completed';
                agentData[actor].cost_usd = Number(payload.cost_usd) || agentData[actor].cost_usd || 0;
                agentData[actor].turns = payload.num_turns || agentData[actor].turns || 0;
                agentData[actor].error = payload.error;
            }
        }

        function recordFindingFromEvent(ev) {
            const payload = ev.payload || {};
            // Assumption: sqlite_sink.py ingest_event reads finding.recorded payload as
            // flat {worker, topic, summary} (see agentgraph/sqlite_sink.py ~198-208).
            // Fall back to a nested object.data shape defensively in case the wire
            // format differs from the mirror's own read path.
            const summary = payload.summary
                || (payload.object && payload.object.data && payload.object.data.summary)
                || '';
            const alreadyRecorded = findings.some(finding => finding.seq === ev.seq);

            if (alreadyRecorded) {
                return;
            }

            findings.push({
                seq: ev.seq,
                worker: payload.worker || ev.actor,
                topic: payload.topic || '',
                summary
            });

            renderFindings();
        }

        function handleRunComplete(e) {
            const { status } = JSON.parse(e.data);
            runStatus = status || 'completed';
            renderStatusPill(runStatus);
            checkRunStatus();
            hideConnectionBadge();

            if (missionEventSource) {
                missionEventSource.close();
            }
        }

        function renderStatusPill(status) {
            const statusSpan = document.getElementById('run-status');
            statusSpan.textContent = status;
            statusSpan.className = `run-info-value run-status ${escapeHtml(status)}`;
        }

        function renderMissionCompletionPill(payload) {
            const pill = document.getElementById('mission-completion-pill');
            const status = payload.status || 'completed';
            const statusClass = status === 'failed' ? 'failed' : 'completed';
            const agentsFailed = payload.agents_failed;
            const gatePassed = payload.gate_passed;

            pill.style.display = 'block';
            pill.className = `mission-completion-pill ${statusClass}`;
            pill.innerHTML = `
                <span class="mission-completion-status">${escapeHtml(status)}</span>
                ${agentsFailed !== undefined ? `<span class="mission-completion-detail">agents failed: ${escapeHtml(agentsFailed)}</span>` : ''}
                ${gatePassed !== undefined ? `<span class="mission-completion-detail">gate passed: ${escapeHtml(gatePassed)}</span>` : ''}
            `;
        }

        function renderSwimLanes() {
            const container = document.getElementById('swimlanes');

            if (Object.keys(agentData).length === 0) {
                container.innerHTML = '<div class="loading">Loading agents</div>';
                return;
            }

            container.innerHTML = Object.entries(agentData).map(([name, agent]) => {
                const events = agentEvents[name] || [];

                return `
                    <div class="swimlane">
                        <div class="swimlane-header">
                            <span class="swimlane-title">${escapeHtml(name)}</span>
                            <div class="swimlane-meta">
                                <div class="swimlane-meta-item">
                                    <span class="swimlane-meta-label">Status</span>
                                    <span class="swimlane-meta-value">${escapeHtml(agent.status || 'unknown')}</span>
                                </div>
                                <div class="swimlane-meta-item">
                                    <span class="swimlane-meta-label">Model</span>
                                    <span class="swimlane-meta-value">${escapeHtml(agent.model || '-')}</span>
                                </div>
                                <div class="swimlane-meta-item">
                                    <span class="swimlane-meta-label">Turns</span>
                                    <span class="swimlane-meta-value">${agent.turns || 0}</span>
                                </div>
                                <div class="swimlane-meta-item">
                                    <span class="swimlane-meta-label">Cost</span>
                                    <span class="swimlane-meta-value">$${(agent.cost_usd || 0).toFixed(4)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="timeline">
                            <div class="timeline-track">
                                <div class="timeline-events">
                                    ${renderTimelineEvents(events)}
                                </div>
                            </div>
                        </div>
                        ${renderAgentFindings(name)}
                    </div>
                `;
            }).join('');
        }

        function timelineEventClass(ev) {
            const baseClass = ev.type.toLowerCase().replace(/\./g, '-');
            const payload = ev.payload || {};

            if (ev.type === 'agent.responded' && payload.error) {
                return `${baseClass} agent-responded-error`;
            }
            return baseClass;
        }

        function timelineEventDetail(ev) {
            const payload = ev.payload || {};

            if (ev.type === 'finding.recorded') {
                const summary = payload.summary
                    || (payload.object && payload.object.data && payload.object.data.summary)
                    || '';
                return summary ? `<br/>${escapeHtml(summary)}` : '';
            }
            if (ev.type === 'command.violated') {
                const command = payload.command || payload.reason || '';
                return command ? `<br/>${escapeHtml(command)}` : '';
            }
            if (ev.type === 'agent.responded' && payload.error) {
                const errorText = typeof payload.error === 'string' ? payload.error : JSON.stringify(payload.error);
                return `<br/>${escapeHtml(errorText)}`;
            }
            return '';
        }

        function renderTimelineEvents(events) {
            if (events.length === 0) {
                return '<div style="text-align: center; color: #999; font-size: 0.85rem; padding: 0.5rem;">No events yet</div>';
            }

            // Calculate positions based on timestamps
            const range = eventTimeRange.max - eventTimeRange.min || 1;

            return events.map(event => {
                const eventTime = Date.parse(event.ts);
                const resolvedTime = Number.isNaN(eventTime) ? eventTimeRange.min : eventTime;
                const position = ((resolvedTime - eventTimeRange.min) / range) * 100;
                const eventClass = timelineEventClass(event);
                const typeLabel = escapeHtml(event.type);
                const timeLabel = escapeHtml(new Date(resolvedTime).toLocaleTimeString());

                return `
                    <div class="timeline-event ${eventClass}"
                         style="left: ${position}%"
                         title="${typeLabel} at ${timeLabel}">
                        <div class="event-tooltip">${typeLabel}<br/>${timeLabel}${timelineEventDetail(event)}</div>
                    </div>
                `;
            }).join('');
        }

        function renderAgentFindings(agentName) {
            const agentFindings = findings.filter(f => f.worker === agentName);

            if (agentFindings.length === 0) {
                return '';
            }

            return `
                <div style="margin-top: 1rem;">
                    ${agentFindings.map(f => `
                        <div class="finding-item">
                            <div class="finding-header">
                                <span class="finding-topic">${escapeHtml(f.topic)}</span>
                            </div>
                            <div class="finding-summary">${escapeHtml(f.summary)}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderFindings() {
            const container = document.getElementById('findings');

            if (findings.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No findings yet</p></div>';
                return;
            }

            container.innerHTML = findings.map(f => `
                <div class="finding-item">
                    <div class="finding-header">
                        <span class="finding-topic">${escapeHtml(f.topic)}</span>
                        <span class="finding-worker">by ${escapeHtml(f.worker)}</span>
                    </div>
                    <div class="finding-summary">${escapeHtml(f.summary)}</div>
                </div>
            `).join('');
        }

        function setupMissionControls() {
            // Set up interrupt button
            const interruptBtn = document.getElementById('interrupt-btn');
            const interruptControl = document.getElementById('interrupt-control');
            const interruptStatus = document.getElementById('interrupt-status');

            interruptBtn.addEventListener('click', async () => {
                interruptBtn.disabled = true;
                interruptStatus.textContent = 'Sending interrupt signal...';

                try {
                    const response = await fetch(`/api/runs/${encodeURIComponent(RUN_ID)}/interrupt`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await response.json();

                    if (response.ok) {
                        interruptStatus.textContent = '✓ Interrupt signal sent';
                        interruptStatus.style.color = '#50c878';
                    } else {
                        interruptStatus.textContent = `✗ ${data.error || 'Failed'}`;
                        interruptStatus.style.color = '#e74c3c';
                        interruptBtn.disabled = false;
                    }
                } catch (error) {
                    interruptStatus.textContent = `✗ Error: ${error.message}`;
                    interruptStatus.style.color = '#e74c3c';
                    interruptBtn.disabled = false;
                }
            });

            // Check run status and show/hide interrupt button
            checkRunStatus();

            // Set up resume controls
            renderAgentBriefEditors();

            const resumeBtn = document.getElementById('resume-btn');
            const resumeStatus = document.getElementById('resume-status');

            resumeBtn.addEventListener('click', async () => {
                resumeBtn.disabled = true;
                resumeStatus.textContent = 'Launching resumed mission...';

                // Collect edited briefs
                const agentEdits = [];
                Object.keys(agentData).forEach(name => {
                    const textarea = document.getElementById(`brief-${name}`);
                    if (textarea) {
                        const newBrief = textarea.value;
                        if (newBrief !== agentData[name].originalBrief) {
                            agentEdits.push({
                                name: name,
                                brief: newBrief,
                                tools: agentData[name].tools || ['Read', 'Grep', 'Glob']
                            });
                        }
                    }
                });

                // Build original agents list
                const originalAgents = Object.keys(agentData).map(name => ({
                    name: name,
                    brief: agentData[name].originalBrief || 'No brief recorded',
                    tools: agentData[name].tools || ['Read', 'Grep', 'Glob']
                }));

                try {
                    const response = await fetch(`/api/runs/${encodeURIComponent(RUN_ID)}/resume`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            original_agents: originalAgents,
                            agent_edits: agentEdits,
                            synthesis: null,
                            max_turns: 30,
                            max_concurrency: 4
                        })
                    });
                    const data = await response.json();

                    if (response.ok) {
                        resumeStatus.textContent = `✓ Resumed as ${data.run_id}`;
                        resumeStatus.style.color = '#50c878';
                        setTimeout(() => {
                            window.location.href = `/runs/${encodeURIComponent(data.run_id)}`;
                        }, 1500);
                    } else {
                        resumeStatus.textContent = `✗ ${data.error || 'Failed'}`;
                        resumeStatus.style.color = '#e74c3c';
                        resumeBtn.disabled = false;
                    }
                } catch (error) {
                    resumeStatus.textContent = `✗ Error: ${error.message}`;
                    resumeStatus.style.color = '#e74c3c';
                    resumeBtn.disabled = false;
                }
            });
        }

        function checkRunStatus() {
            // Authoritative source is the runs-list status field and the
            // run-complete SSE event; interrupt control is only shown while running.
            const interruptControl = document.getElementById('interrupt-control');
            interruptControl.style.display = runStatus === 'running' ? 'block' : 'none';
        }

        function renderAgentBriefEditors() {
            const container = document.getElementById('agent-brief-editors');

            if (Object.keys(agentData).length === 0) {
                container.innerHTML = '<p style="color: #999;">Loading agents...</p>';
                return;
            }

            container.innerHTML = Object.entries(agentData).map(([name, agent]) => {
                // Store original brief for comparison
                agent.originalBrief = `[Original brief not available from mirror - edit for resume]`;

                return `
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-weight: bold; margin-bottom: 0.25rem;">
                            ${escapeHtml(name)}
                        </label>
                        <textarea
                            id="brief-${escapeHtml(name)}"
                            rows="3"
                            style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 0.9rem;"
                        >${escapeHtml(agent.originalBrief)}</textarea>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
