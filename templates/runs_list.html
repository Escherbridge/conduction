<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Runs - Conduction</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.0-beta.1/bundles/datastar.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-store="{ runs: [], loading: true }">
    <div id="app-root">
        <header>
            <h1>Conduction</h1>
            <p>Mission Run Monitor</p>
            <nav>
                <a href="/">Home</a>
                <a href="/launch">Launch Mission</a>
                <a href="/factory">Factory Pipelines</a>
            </nav>
        </header>
        <main id="main-content">
            <div class="runs-list">
                <h2>Mission Runs</h2>
                <div id="runs-container" data-on-load="@get('/api/runs')"></div>
            </div>
        </main>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[character]));
        }

        function repoBasename(fullPath) {
            if (!fullPath) {
                return null;
            }
            const normalized = fullPath.replace(/\\/g, '/');
            const segments = normalized.split('/').filter(Boolean);
            return segments.length ? segments[segments.length - 1] : fullPath;
        }

        // run_id format is MISSION-<slug>@<8-hex-repo-key>; the repo key suffix
        // is optional so older runs without it still render correctly.
        function parseRunId(runId) {
            const withoutPrefix = runId.startsWith('MISSION-') ? runId.slice('MISSION-'.length) : runId;
            const atIndex = withoutPrefix.lastIndexOf('@');

            if (atIndex === -1) {
                return { slugPart: withoutPrefix, repoKey: null };
            }
            return {
                slugPart: withoutPrefix.slice(0, atIndex),
                repoKey: withoutPrefix.slice(atIndex + 1)
            };
        }

        // Fetch and render runs on page load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/runs');
                const runs = await response.json();

                const container = document.getElementById('runs-container');

                if (!Array.isArray(runs) || runs.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>No mission runs found</p>
                        </div>
                    `;
                    return;
                }

                const sortedRuns = [...runs].sort((a, b) => new Date(b.started_at) - new Date(a.started_at));

                container.innerHTML = sortedRuns.map(run => {
                    const { slugPart, repoKey } = parseRunId(run.run_id);
                    const repoName = repoBasename(run.target_repo);
                    const encodedRunId = encodeURIComponent(run.run_id);
                    const statusLabel = run.status || 'running';
                    const kind = run.kind || 'legacy';
                    const parentRunId = run.parent_run_id;

                    return `
                        <div class="run-item">
                            <div>
                                <a href="/runs/${encodedRunId}">${escapeHtml(slugPart)}</a>
                                <div class="run-item-badges">
                                    <span class="kind-badge kind-${escapeHtml(kind)}">${escapeHtml(kind)}</span>
                                    ${repoName ? `<span class="repo-badge" title="${escapeHtml(run.target_repo)}">${escapeHtml(repoName)}</span>` : ''}
                                    ${repoKey ? `<span class="repo-key-badge" title="repo key">${escapeHtml(repoKey)}</span>` : ''}
                                </div>
                                ${kind === 'replay' && parentRunId ? `<div style="font-size: 0.8rem; color: #666; margin-top: 0.25rem;">$0 replay of <a href="/runs/${encodeURIComponent(parentRunId)}" style="color: #667eea;">${escapeHtml(parentRunId)}</a></div>` : ''}
                            </div>
                            <div class="run-meta">
                                <span>${run.started_at ? new Date(run.started_at).toLocaleString() : '-'}</span>
                                <span class="run-status ${escapeHtml(statusLabel)}">${escapeHtml(statusLabel)}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error fetching runs:', error);
                document.getElementById('runs-container').innerHTML = `
                    <div class="empty-state">
                        <p>Error loading runs: ${escapeHtml(error.message)}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
