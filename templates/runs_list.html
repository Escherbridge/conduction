{% extends "base.html" %}

{% block title %}Runs{% endblock %}

{% block content %}
<div class="page">
    <div class="card">
        <h2 class="card-title">Mission Runs</h2>

        <!-- Filters -->
        <div class="form-grid" style="margin-bottom: 1.5rem;">
            <div class="field">
                <label>Filter by Project</label>
                <select id="project-filter" class="form-input">
                    <option value="">All Projects</option>
                </select>
            </div>
            <div class="field">
                <label>Filter by Status</label>
                <select id="status-filter" class="form-input">
                    <option value="">All Statuses</option>
                    <option value="running">Running</option>
                    <option value="completed">Completed</option>
                    <option value="failed">Failed</option>
                    <option value="interrupted">Interrupted</option>
                </select>
            </div>
        </div>

        <div id="runs-container"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const { escapeHtml, pill, fmtCost, fmtAgo, encodeId } = window.Conduction;

    function repoBasename(fullPath) {
        if (!fullPath) return null;
        const normalized = fullPath.replace(/\\/g, '/');
        const segments = normalized.split('/').filter(Boolean);
        return segments.length ? segments[segments.length - 1] : fullPath;
    }

    function parseRunId(runId) {
        const withoutPrefix = runId.startsWith('MISSION-') ? runId.slice('MISSION-'.length) : runId;
        const atIndex = withoutPrefix.lastIndexOf('@');
        if (atIndex === -1) {
            return { slugPart: withoutPrefix, repoKey: null };
        }
        return {
            slugPart: withoutPrefix.slice(0, atIndex),
            repoKey: withoutPrefix.slice(atIndex + 1)
        };
    }

    let allRuns = [];
    let filteredRuns = [];

    async function loadRuns() {
        try {
            const runs = await window.Conduction.fetchJson('/api/runs');
            allRuns = runs;

            // Populate project filter
            const projects = new Set();
            runs.forEach(run => {
                if (run.target_repo) {
                    projects.add(run.target_repo);
                }
            });

            const projectFilter = document.getElementById('project-filter');
            const currentProject = projectFilter.value;
            projectFilter.innerHTML = '<option value="">All Projects</option>' +
                Array.from(projects).sort().map(proj => {
                    const name = repoBasename(proj);
                    return `<option value="${escapeHtml(proj)}">${escapeHtml(name)}</option>`;
                }).join('');
            projectFilter.value = currentProject;

            applyFilters();
        } catch (error) {
            console.error('Error fetching runs:', error);
            document.getElementById('runs-container').innerHTML = `
                <div class="empty-state">
                    <p>Error loading runs: ${escapeHtml(error.message)}</p>
                </div>
            `;
        }
    }

    function applyFilters() {
        const projectFilter = document.getElementById('project-filter').value;
        const statusFilter = document.getElementById('status-filter').value;

        filteredRuns = allRuns.filter(run => {
            if (projectFilter && run.target_repo !== projectFilter) return false;
            if (statusFilter && run.status !== statusFilter) return false;
            return true;
        });

        renderRuns();
    }

    function renderRuns() {
        const container = document.getElementById('runs-container');

        if (filteredRuns.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <p>No mission runs found</p>
                </div>
            `;
            return;
        }

        const sortedRuns = [...filteredRuns].sort((a, b) => new Date(b.started_at) - new Date(a.started_at));

        container.innerHTML = `
            <table class="table">
                <thead>
                    <tr>
                        <th>Run</th>
                        <th>Project</th>
                        <th>Status</th>
                        <th>Gate</th>
                        <th>Cost</th>
                        <th>Started</th>
                    </tr>
                </thead>
                <tbody>
                    ${sortedRuns.map(run => {
                        const { slugPart, repoKey } = parseRunId(run.run_id);
                        const repoName = repoBasename(run.target_repo);
                        const encodedRunId = encodeId(run.run_id);
                        const statusLabel = run.status || 'running';
                        const kind = run.kind || 'legacy';
                        const parentRunId = run.parent_run_id;
                        const gatePassed = run.gate_passed;
                        const costUsd = run.cost_usd || 0;

                        return `
                            <tr>
                                <td>
                                    <a href="/runs/${encodedRunId}">${escapeHtml(slugPart)}</a>
                                    <div style="margin-top: 0.25rem;">
                                        <span class="pill pill-${escapeHtml(kind)}">${escapeHtml(kind)}</span>
                                        ${repoKey ? `<span class="badge mono" title="repo key">${escapeHtml(repoKey)}</span>` : ''}
                                    </div>
                                    ${kind === 'replay' && parentRunId ? `<div class="muted" style="font-size: 0.85rem; margin-top: 0.25rem;">replay of <a href="/runs/${encodeId(parentRunId)}">${escapeHtml(parentRunId)}</a></div>` : ''}
                                </td>
                                <td>
                                    ${repoName ? `<span class="badge" title="${escapeHtml(run.target_repo)}">${escapeHtml(repoName)}</span>` : '-'}
                                </td>
                                <td>
                                    ${pill(statusLabel)}
                                </td>
                                <td>
                                    ${gatePassed !== undefined ? (gatePassed ? '<span class="pill pill-passed">passed</span>' : '<span class="pill pill-failed">failed</span>') : '-'}
                                </td>
                                <td class="mono">
                                    ${fmtCost(costUsd)}
                                </td>
                                <td class="muted">
                                    ${run.started_at ? fmtAgo(run.started_at) : '-'}
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadRuns();

        document.getElementById('project-filter').addEventListener('change', applyFilters);
        document.getElementById('status-filter').addEventListener('change', applyFilters);
    });
</script>
{% endblock %}
