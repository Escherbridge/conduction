[tool.ruff]
# 100, not black's 88: only 6 lines in the repo exceed 100, versus 55 rewrapped
# at 88. See conductor/decisions.md D1.
line-length = 100
target-version = "py312"
exclude = [
    "venv", ".venv", "__pycache__", ".agentgraph",
    # agentgraph/ is a VENDORED copy of the engine (see tests/conftest.py).
    # Reformatting it would diverge this copy from upstream for zero benefit --
    # 18 files and ~300 lines of churn in code we did not write. Revisit if the
    # copy is ever declared a hard fork.
    "agentgraph",
    # Dead and broken: imported nowhere, and ruff finds a real syntax error
    # (ForeignKey=(...)) plus typos (delete-orpha, alingment). Delete or fix it;
    # until then it is not worth failing every lint run over.
    "database.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Sanic handlers shadow the module-level `app` by design; the framework
    # passes the app instance as the first argument.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Blueprint handlers import app helpers lazily inside functions -- app.py
# imports these modules, so a module-level import would be circular.
"routes/*.py" = ["PLC0415"]
# app.py registers blueprints after its helpers exist, so those imports are
# deliberately not at the top of the file.
"app.py" = ["E402"]
