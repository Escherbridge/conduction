[tool.ruff]
# 100, not black's 88: only 6 lines in the repo exceed 100, versus 55 rewrapped
# at 88. See conductor/decisions.md D1.
line-length = 100
target-version = "py312"
exclude = [
    "venv", ".venv", "__pycache__", ".agentgraph",
    # The VENDORED engine modules (see tests/conftest.py). Reformatting them
    # would diverge this copy from upstream for zero benefit. Listed file by
    # file rather than as a directory so anything WE add under agentgraph/ --
    # procs.py, for one -- is linted like the rest of the repo.
    "agentgraph/__init__.py",
    "agentgraph/agentcache.py",
    "agentgraph/behaviors.py",
    "agentgraph/claims.py",
    "agentgraph/context.py",
    "agentgraph/dispatcher.py",
    "agentgraph/events.py",
    "agentgraph/factory.py",
    "agentgraph/gates.py",
    "agentgraph/host.py",
    "agentgraph/log.py",
    "agentgraph/manifest.py",
    "agentgraph/mcp_tools.py",
    "agentgraph/mission.py",
    "agentgraph/narrate.py",
    "agentgraph/policy.py",
    "agentgraph/replay.py",
    "agentgraph/sdk_workers.py",
    "agentgraph/sqlite_sink.py",
    "agentgraph/transcript.py",
    "agentgraph/workerapi.py",
    # Dead and broken: imported nowhere, and ruff finds a real syntax error
    # (ForeignKey=(...)) plus typos (delete-orpha, alingment). Delete or fix it;
    # until then it is not worth failing every lint run over.
    "database.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Sanic handlers shadow the module-level `app` by design; the framework
    # passes the app instance as the first argument.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Blueprint handlers import app helpers lazily inside functions -- app.py
# imports these modules, so a module-level import would be circular.
"routes/*.py" = ["PLC0415"]
# app.py registers blueprints after its helpers exist, so those imports are
# deliberately not at the top of the file.
"app.py" = ["E402"]
